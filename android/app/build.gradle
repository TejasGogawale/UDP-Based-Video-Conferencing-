plugins {
    id 'com.android.application'
}

android {
    namespace 'edu.vit.connect'
    compileSdk 34

    defaultConfig {
        applicationId "edu.vit.connect"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Points directly to the deployed production frontend (never runs on localhost)
        buildConfigField "String", "DEPLOYED_WEB_URL", '"https://udp-based-video-conferencing.vercel.app"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
